<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTU PoolFlow 未游先知 · 台大泳池人流即時看板</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f9fa; --surface: #ffffff; --border: #e9ecef; --text: #212529; --muted: #6c757d;
    --blue: #0d6efd; --green: #198754; --amber: #ffc107; --red: #dc3545;
    --mono: 'DM Mono', monospace; --sans: 'Noto Sans TC', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1e1e1e; --border: #2d2d2d; --text: #f8f9fa; --muted: #a0a0a0;
    }
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); padding: 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 540px; padding: 1.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .header { margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 14px; font-weight: 700; color: var(--muted); }
  
  .mode-badge-group { display: flex; background: var(--bg); padding: 2px; border-radius: 20px; border: 1px solid var(--border); }
  .mode-btn { background: none; border: none; padding: 4px 12px; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 16px; cursor: pointer; transition: all 0.2s; }
  .mode-btn.active { color: #ffffff; }
  .mode-btn.active.static { background: var(--green); box-shadow: 0 2px 6px rgba(25,135,84,0.3); }
  .mode-btn.active.sim { background: var(--red); box-shadow: 0 2px 6px rgba(220,53,69,0.3); }
  
  .dashboard-row { display: flex; align-items: center; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
  .hero-left { display: flex; flex-direction: column; align-items: flex-end; }
  .huge-num { font-family: var(--mono); font-size: 68px; font-weight: 700; line-height: 1; color: var(--text); }
  .hero-unit { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; text-align: right; }
  
  .status-light-box { 
    width: 150px; height: 150px; border-radius: 50%; 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    text-align: center; padding: 10px; font-weight: 700; font-size: 15px; line-height: 1.35;
    transition: all 0.4s ease; box-shadow: inset 0 2px 8px rgba(0,0,0,0.06); color: #ffffff;
  }
  .trend-arrow { font-size: 11px; margin-top: 6px; font-weight: 500; background: rgba(0,0,0,0.12); padding: 2px 8px; border-radius: 10px; }
  .light-grey  { background: #6c757d; box-shadow: 0 0 20px rgba(108,117,125,0.3); }
  .light-green { background: #198754; box-shadow: 0 0 25px rgba(25,135,84,0.4); }
  .light-amber { background: #ffc107; box-shadow: 0 0 25px rgba(255,193,7,0.4); color: #212529 !important; }
  .light-red   { background: #dc3545; box-shadow: 0 0 25px rgba(220,53,69,0.4); }

  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .decision-title { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .chart-container { position: relative; height: 240px; width: 100%; margin-top: 0.5rem; }
  .footer { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    font-size: 11px; 
    font-family: var(--mono); 
    color: var(--muted); 
    margin-top: 1.5rem; 
    border-top: 1px solid var(--border); 
    padding-top: 0.75rem; 
    gap: 12px;
  }
  .footer div {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .raw-link { color: var(--blue); text-decoration: none; border-bottom: 1px dashed var(--blue); }
  .refresh-btn { background: none; border: 1px solid var(--border); padding: 2px 8px; border-radius: 12px; color: var(--muted); cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">台大綜合體育館 · 溫水游泳池</div>
    <div class="mode-badge-group">
      <button class="mode-btn static active" id="mode-static" onclick="switchMode('static')">樣本數據</button>
      <button class="mode-btn sim" id="mode-sim" onclick="switchMode('sim')">動態模擬</button>
    </div>
  </div>
  
  <div class="dashboard-row">
    <div class="hero-left">
      <div class="huge-num" id="curr-count">—</div>
      <div class="hero-unit">現場人數</div>
    </div>
    <div class="status-light-box light-grey" id="status-light">
      <div id="light-text">載入中...</div>
      <div class="trend-arrow" id="trend-icon">➔ 穩定</div>
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="decision-title" id="chart-title">圖表載入中...</div>
    </div>
    <div class="chart-container">
      <canvas id="multiChart"></canvas>
    </div>
  </div>

  <div class="footer">
    <span id="update-time">最後更新: —</span>
    <div>
      <a class="raw-link" href="docs/predictive-crowd-offset.md" target="_blank">🔮 預測機制</a>
      <a class="raw-link" href="https://github.com/8915ethan/ntu-pool" target="_blank">📦 GitHub 專案</a>
      <button class="refresh-btn" onclick="loadData()">↻ 重整</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let chart = null;
let rawHistoryData = [];
let currentDisplayMode = 'static';

// 7 水道容量基準 (快適: 33 人, 擁擠: 42 人)
const BASE_COMFORTABLE = 33;
const BASE_CROWDED = 42;

function calculatePredictiveOffset(todayPoints) {
  const len = todayPoints.length;
  if (len < 4) return 0;

  const p0 = todayPoints[len - 1];
  const p1 = todayPoints[len - 2];
  const p2 = todayPoints[len - 3];
  const p3 = todayPoints[len - 4];

  const parseMinutes = (t) => {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  };

  const pairs = [[p0, p1], [p1, p2], [p2, p3]];
  const weights = [3, 2, 1];
  let weightedRateSum = 0;
  let weightTotal = 0;
  let validIntervalCount = 0;

  for (let i = 0; i < 3; i++) {
    const [curr, prev] = pairs[i];
    const dt = parseMinutes(curr.time) - parseMinutes(prev.time);
    if (dt > 0 && dt <= 25) {
      const ratePerMinute = (curr.value - prev.value) / dt;
      weightedRateSum += ratePerMinute * weights[i];
      weightTotal += weights[i];
      validIntervalCount++;
    }
  }

  if (weightTotal === 0 || validIntervalCount === 0) return 0;

  const weightedRatePerMin = weightedRateSum / weightTotal;
  const predictedChange15m = weightedRatePerMin * 15;

  const isFullConfidence = validIntervalCount === 3;
  const damping = isFullConfidence ? 0.7 : 0.5;
  const clampLimit = isFullConfidence ? 8 : 4;

  const offset = -Math.round(predictedChange15m * damping);
  return Math.max(-clampLimit, Math.min(clampLimit, offset));
}

function calculateTrend(todayPoints) {
  if (todayPoints.length <= 1) return '➔';
  const currentIdx = todayPoints.length - 1;
  const startIdx = Math.max(0, currentIdx - 6);
  const slicePoints = todayPoints.slice(startIdx, currentIdx); 
  if (slicePoints.length > 0) {
    const sum = slicePoints.reduce((acc, p) => acc + p.value, 0);
    const intervalAvg = sum / slicePoints.length;
    if (todayPoints[currentIdx].value > intervalAvg + 1) return '↑';
    if (todayPoints[currentIdx].value < intervalAvg - 1) return '↓';
  }
  return '➔';
}

function switchMode(mode) {
  currentDisplayMode = mode;
  document.getElementById('mode-static').classList.toggle('active', mode === 'static');
  document.getElementById('mode-sim').classList.toggle('active', mode === 'sim');
  loadData();
}

async function loadData() {
  if (currentDisplayMode === 'static') {
    try {
      const res = await fetch('./data/history.json');
      rawHistoryData = await res.json();
      renderDashboard();
    } catch {
      rawHistoryData = generateSampleData();
      renderDashboard();
    }
  } else {
    rawHistoryData = generateSampleData();
    renderDashboard();
  }
}

function generateSampleData() {
  const dayLabels = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  const list = [];
  
  // 過去同天
  for (let h = 8; h <= 21; h += 2) {
    list.push({ date: '2026-10-28', day: '週三', time: h.toString().padStart(2, '0') + ':00', value: Math.floor(Math.random() * 20) + 15 });
  }

  // 今日
  const times = ['07:35', '08:00', '09:00', '11:00', '12:30', '14:00', '15:30', '16:30', '17:00', '17:15', '17:30'];
  let cur = 10;
  times.forEach((t, idx) => {
    if (idx === 0) cur = 8; // 開館 baseline
    else if (t >= '16:30') cur += Math.floor(Math.random() * 6) + 3; // 尖峰急湧
    else cur += Math.floor(Math.random() * 5) - 2;
    list.push({ date: todayStr, day: dayLabels[now.getDay()], time: t, value: Math.max(0, cur) });
  });

  return list;
}

function renderDashboard() {
  const lastNode = rawHistoryData[rawHistoryData.length - 1];
  const todayStr = lastNode ? lastNode.date : new Date().toISOString().split('T')[0];
  const todayPoints = rawHistoryData.filter(p => p.date === todayStr);
  const latest = todayPoints[todayPoints.length - 1] || { value: 39, time: '17:30' };

  const netCount = latest.value;
  const offset = calculatePredictiveOffset(todayPoints);
  const trend = calculateTrend(todayPoints);

  const currCountEl = document.getElementById('curr-count');
  const lightEl = document.getElementById('status-light');
  const lightTextEl = document.getElementById('light-text');
  const trendEl = document.getElementById('trend-icon');

  currCountEl.textContent = netCount;
  trendEl.textContent = trend === '↑' ? '人潮增加中' : trend === '↓' ? '人潮漸散去' : '人潮持平';

  const amberThreshold = BASE_COMFORTABLE + offset;
  const redThreshold = BASE_CROWDED + offset;

  if (netCount >= redThreshold) {
    lightTextEl.innerHTML = "人潮擁擠<br>請稍候";
    lightEl.className = "status-light-box light-red";
  } else if (netCount >= amberThreshold) {
    lightTextEl.innerHTML = "人數中等<br>可入場";
    lightEl.className = "status-light-box light-amber";
  } else {
    lightTextEl.innerHTML = "泳池舒適<br>GO GO！";
    lightEl.className = "status-light-box light-green";
  }

  document.getElementById('update-time').textContent = `最後更新: ${latest.time} (現場:${latest.value}人 | 門檻偏移 ${offset})`;
  document.getElementById('chart-title').innerHTML = `7 水道人潮走勢 (舒適門檻 ${amberThreshold}人 · 擁擠門檻 ${redThreshold}人)`;

  updateChart(todayPoints);
}

function updateChart(todayPoints) {
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  // 網頁圖表只從實際開館時間 08:00 開始顯示
  const displayPoints = todayPoints.filter(p => p.time >= '08:00');
  const labels = displayPoints.map(p => p.time);
  const data = displayPoints.map(p => p.value);

  const datasets = [
    {
      label: '今日現場人數',
      data: data,
      borderColor: '#0d6efd',
      borderWidth: 3,
      tension: 0.2,
      fill: false,
      pointRadius: 4,
    }
  ];

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.update();
    return;
  }

  chart = new Chart(document.getElementById('multiChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { font: { size: 9, family: "'DM Mono'" } }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { font: { size: 9, family: "'DM Mono'" } }, grid: { color: isDark ? '#2d2d2d' : '#e9ecef' } }
      }
    }
  });
}

loadData();
</script>
</body>
</html>
